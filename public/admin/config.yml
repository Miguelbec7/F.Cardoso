backend:
  name: github
  repo: Miguelbec7/F.Cardoso
  branch: claude/fcardoso-auto-website-sgw200
  base_url: https://fcardoso-cms-auth.miguelbec97.workers.dev
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: carros
    label: Automóveis
    label_singular: Automóvel
    folder: content/carros
    create: true
    slug: "{{fields.marca}}-{{fields.modelo}}-{{fields.versao}}-{{fields.ano}}"
    summary: "{{marca}} {{modelo}} — {{ano}} — {{preco}} € · {{estado}}"
    sortable_fields: ["criadoEm", "preco", "ano"]
    view_groups:
      - { label: "Por estado", field: estado }
    view_filters:
      - { label: "Disponíveis", field: estado, pattern: "disponivel" }
      - { label: "Reservados", field: estado, pattern: "reservado" }
      - { label: "Vendidos", field: estado, pattern: "vendido" }
      - { label: "Em destaque", field: destaque, pattern: true }
      - { label: "Carro da semana", field: carroDaSemana, pattern: true }
      - { label: "Recém-chegados", field: recemChegado, pattern: true }
    fields:
      - { label: Marca, name: marca, widget: string }
      - { label: Modelo, name: modelo, widget: string }
      - { label: Versão, name: versao, widget: string }
      - { label: Ano, name: ano, widget: number, value_type: int }
      - label: Estado
        name: estado
        widget: select
        hint: "Muda para \"Vendido\" assim que o carro sair — fica no histórico, só deixa de aparecer no stock disponível."
        options:
          - { label: Disponível, value: disponivel }
          - { label: Reservado, value: reservado }
          - { label: Vendido, value: vendido }
        default: disponivel
      - {
          label: "Data de venda",
          name: vendidoEm,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
          hint: "Preencher só quando mudares o Estado para \"Vendido\" — define a ordem em \"Recentemente vendidos\".",
        }
      - { label: "Em destaque na homepage?", name: destaque, widget: boolean, default: false }
      - {
          label: "É o carro da semana?",
          name: carroDaSemana,
          widget: boolean,
          default: false,
          hint: "Só pode haver um de cada vez — ao ativar este, desativa manualmente nos outros carros.",
        }
      - { label: "Marcar como recém-chegado?", name: recemChegado, widget: boolean, default: false }
      - { label: Quilómetros, name: km, widget: number, value_type: int }
      - label: Combustível
        name: combustivel
        widget: select
        options: [Gasolina, Diesel, Híbrido, Elétrico]
      - label: Caixa
        name: caixa
        widget: select
        options: [Manual, Automática]
      - label: Carroçaria
        name: carroceria
        widget: select
        options: [Berlina, Break, SUV, Hatchback, Coupé, Comercial]
      - { label: Cilindrada, name: cilindrada, widget: string, required: false }
      - { label: Potência (cv), name: potencia, widget: number, value_type: int }
      - { label: Cor, name: cor, widget: string, required: false }
      - { label: Preço (€), name: preco, widget: number, value_type: int }
      - { label: Preço anterior (€), name: precoAnterior, widget: number, value_type: int, required: false }
      - label: Equipamento
        name: equipamento
        widget: object
        collapsed: true
        required: false
        fields:
          - label: Informação Geral
            name: geral
            widget: select
            multiple: true
            required: false
            options:
              [
                "Ar condicionado",
                "Ar condicionado automático",
                "Ar condicionado automático bi-zona",
                "Não fumador",
                "Semi-novo",
                "Teto de abrir",
                "Teto panorâmico",
                "Iluminação ambiente",
              ]
          - label: Exterior
            name: exterior
            widget: select
            multiple: true
            required: false
            options: ["Jantes de liga leve", "Pintura metalizada", "Barras de tejadilho", "Reboque"]
          - label: Faróis
            name: farois
            widget: select
            multiple: true
            required: false
            options:
              [
                "Faróis LED",
                "Faróis Full LED",
                "Faróis de nevoeiro",
                "Faróis direcionais",
                "Faróis traseiros LED",
                "Luzes diurnas LED",
                "Luzes direcionais dinâmicas",
                "Farolim traseiro LED",
                "Faróis máximos automáticos",
                "Faróis reguláveis em altura",
              ]
          - label: Retrovisores
            name: retrovisores
            widget: select
            multiple: true
            required: false
            options:
              [
                "Retrovisores exteriores com regulação elétrica",
                "Retrovisores com anti-encadeamento",
                "Retrovisores exteriores retráteis eletricamente",
              ]
          - label: Vidros
            name: vidros
            widget: select
            multiple: true
            required: false
            options:
              ["Vidros elétricos dianteiros e traseiros", "Vidros escurecidos", "Vidros insonorizantes e atérmicos"]
          - label: Bancos
            name: bancos
            widget: select
            multiple: true
            required: false
            options:
              [
                "Bancos em pele",
                "Estofos em pele e tecido",
                "Bancos desportivos",
                "Bancos elétricos",
                "Bancos aquecidos",
                "Bancos rebatíveis",
                "Encostos de cabeça traseiros",
              ]
          - label: Volante
            name: volante
            widget: select
            multiple: true
            required: false
            options:
              [
                "Volante multifunções",
                "Volante em pele",
                "Volante regulável em altura",
                "Volante regulável em profundidade",
                "Comandos do rádio no volante",
              ]
          - label: Conforto & Multimédia
            name: multimedia
            widget: select
            multiple: true
            required: false
            options:
              [
                "Navegação GPS",
                "Bluetooth",
                "Computador de bordo",
                "Cruise Control",
                "Cruise Control adaptativo",
                "Ecrã consola central",
                "Ecrã tátil",
                "Encostos de cabeça com ecrã",
                "Apple CarPlay",
                "Android Auto",
                "Digital Cockpit",
                "Head-up display",
                "Sistema de som",
                "Sistema de som premium",
                "Controlo de funções do veículo por voz",
                "USB",
                "Tomada 12V",
                "Carregador sem fios",
              ]
          - label: Segurança & Desempenho
            name: seguranca
            widget: select
            multiple: true
            required: false
            options:
              [
                "ABS",
                "Airbag do condutor",
                "Airbag do passageiro",
                "Airbags laterais",
                "Airbags de cortina",
                "Airbag central",
                "ESP - Controlo eletrónico de estabilidade",
                "Isofix",
                "Alarme",
                "Imobilizador",
                "Câmara de marcha atrás",
                "Câmara 360°",
                "Sensores de estacionamento",
                "Sensor de estacionamento dianteiro",
                "Assistente de estacionamento",
                "Assistente de manutenção de faixa",
                "Assistente de mudança de faixa",
                "Sistema de aviso de transposição da via",
                "Assistente de ângulo morto",
                "Controlo de proximidade",
                "Limitador de velocidade",
                "Assistente de travagem",
                "Sistema de controlo de tração",
                "Hill Descent Control",
                "Hill Holder",
                "Reconhecimento de sinais de trânsito",
                "Reconhecimento ativo de sinais de velocidade",
                "Sistema de alerta de colisão",
                "Sistema de alerta pré-colisão",
                "Sistema pré-colisão traseiro",
                "Sistema de deteção de fadiga",
                "Chamada automática de SOS",
                "Travão de mão elétrico",
                "Sistema start/stop",
                "Chave inteligente",
                "Fecho central sem chave",
                "Arranque sem chave",
                "2ª chave",
                "Suspensão desportiva",
                "Suspensão pneumática",
                "Fecho central",
                "Direção assistida",
                "Sensores de chuva",
                "Follow me home",
              ]
          - label: "Outros (não está na lista)"
            name: outros
            widget: list
            required: false
            field: { label: Item, name: item, widget: string }
      - { label: Descrição, name: descricao, widget: text }
      - { label: Garantia, name: garantia, widget: string, default: "12 meses de garantia mecânica" }
      - { label: Localização, name: localizacao, widget: string }
      - { label: Data de publicação, name: criadoEm, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: Fotografias
        name: fotos
        widget: list
        field: { label: Foto, name: image, widget: image }
        required: false
      - { label: Vídeo (opcional), name: video, widget: file, required: false }

  - name: testemunhos
    label: Testemunhos
    folder: content/testemunhos
    create: true
    slug: "{{fields.nome}}"
    summary: "{{nome}} — {{carro}}"
    fields:
      - { label: Nome do cliente, name: nome, widget: string }
      - { label: Estrelas (1-5), name: estrelas, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: Automóvel comprado, name: carro, widget: string }
      - { label: Data, name: data, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Texto da avaliação, name: texto, widget: text }
      - { label: Foto do cliente (opcional), name: foto, widget: image, required: false }

  - name: settings
    label: Definições do site
    files:
      - name: site
        label: Geral
        file: content/settings/site.json
        fields:
          - { label: Número de WhatsApp (só dígitos, com indicativo 351), name: whatsappNumber, widget: string }
          - { label: Telefone (para exibir), name: telefone, widget: string }
          - { label: Vídeo de fundo do Hero, name: heroVideo, widget: file, required: false }
          - { label: Poster do vídeo do Hero (frame estático), name: heroVideoPoster, widget: image, required: false }
          - {
              label: "Vídeo intermédio (tira de destaque a meio da homepage)",
              name: videoStrip,
              widget: file,
              required: false,
            }
          - { label: Poster do vídeo intermédio, name: videoStripPoster, widget: image, required: false }
          - label: Estatísticas
            name: stats
            widget: object
            fields:
              - { label: Viaturas vendidas, name: viaturasVendidas, widget: string }
              - { label: Clientes satisfeitos, name: clientesSatisfeitos, widget: string }
              - { label: Anos de experiência, name: anosExperiencia, widget: string }
          - label: Avaliação Google
            name: googleReviews
            widget: object
            fields:
              - { label: Média (0 a 5), name: media, widget: number, value_type: float }
              - { label: Nº de reviews, name: total, widget: number, value_type: int }
          - label: Marcas em destaque (faixa da homepage)
            name: marcas
            widget: list
            field: { label: Marca, name: marca, widget: string }
          - label: Redes sociais
            name: redesSociais
            widget: object
            required: false
            fields:
              - { label: "Facebook (URL completo)", name: facebook, widget: string, required: false }
              - { label: "Instagram (URL completo)", name: instagram, widget: string, required: false }
